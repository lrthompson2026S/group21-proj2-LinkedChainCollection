plugins {
    id 'java'
    id 'application'
}

group = "proj2"
version = "1.0-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

application {
    mainClass = 'proj2.Main'
}

dependencies {
    implementation files('lib/student.jar')
}
